name: release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  id-token: write

jobs:
  ubuntu-latest:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v4
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      - name: 'NuGet login (OIDC)'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: 'Mint the changelog push token'
        id: app-token
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets.CHANGELOG_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
      - name: 'Run: Test, ReportCoverage, Pack, Publish'
        run: ./build.cmd Test ReportCoverage Pack Publish
        env:
          CoverallRepoKey: ${{ secrets.COVERALL_REPO_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NuGetApiKey: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          ChangelogPushToken: ${{ steps.app-token.outputs.token }}
          ChangelogPushAppSlug: ${{ steps.app-token.outputs.app-slug }}
      - name: 'Publish: test-results'
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: output/test-results
      - name: 'Publish: packages'
        uses: actions/upload-artifact@v5
        with:
          name: packages
          path: output/packages
