# Trunk-based development: master is the only long-lived branch and every merge
# into it is released.
#
# GitHubFlow computes the next version from the most recent tag, incrementing the
# patch by default. To release a minor or major instead, put a directive in the
# merge commit message:
#
#   +semver: minor     ->  2.1.4  becomes  2.2.0
#   +semver: major     ->  2.1.4  becomes  3.0.0
#
# The release workflow publishes GitVersion's MajorMinorPatch and tags the commit
# with it, so the next merge starts from that tag.
workflow: GitHubFlow/v1
